<title>The Gate of Kindling</title>
<style>
  /* ============ THE GATE OF KINDLING — prototype ============
     A single-theme night-world: this page deliberately commits
     to the dark mountain scene in Kindling's navy + gold. */

  :root{
    --night:#0d1526;        /* deep sky */
    --night-2:#131e35;      /* card navy */
    --ridge:#1b2946;        /* mountain mid */
    --ridge-far:#16223c;    /* mountain far */
    --parchment:#f1e8d4;    /* main text */
    --mist:#93a0bf;         /* secondary text */
    --gold:#d4a038;         /* kindling gold */
    --gold-bright:#eec06a;  /* highlights */
    --ember:#e5782e;        /* flame core */
    --line:rgba(212,160,56,.25);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--night)}
  body{
    font-family:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,serif;
    color:var(--parchment);
    min-height:100svh;
    display:flex;flex-direction:column;align-items:center;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- night sky + mountain scene ---------- */
  .scene{
    position:relative;width:100%;max-width:560px;height:190px;
    overflow:hidden;flex:none;
    background:linear-gradient(180deg,#0a111f 0%,#0d1526 55%,#122040 100%);
  }
  .star{position:absolute;width:2px;height:2px;border-radius:50%;
    background:#cfd8ee;opacity:.7;animation:twinkle 3.5s ease-in-out infinite}
  .peak{position:absolute;bottom:0;width:100%;height:100%}
  .peak.far{clip-path:polygon(0 100%,0 62%,18% 40%,33% 58%,52% 30%,68% 52%,84% 36%,100% 58%,100% 100%);
    background:var(--ridge-far)}
  .peak.near{clip-path:polygon(0 100%,0 78%,22% 55%,38% 70%,50% 38%,63% 60%,80% 46%,100% 72%,100% 100%);
    background:var(--ridge)}
  .moon{position:absolute;top:18px;right:26px;width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#f5ecd8,#c9c2ad 70%);
    box-shadow:0 0 28px 6px rgba(240,230,205,.18)}
  .unicorn{position:absolute;font-size:13px;opacity:0;transition:opacity 1.2s ease;
    top:52px;right:23%;filter:brightness(1.6) saturate(.4)}
  .unicorn.show{opacity:.85}

  /* the climbing flame */
  .flame{
    position:absolute;left:8%;bottom:14px;width:16px;height:22px;
    transition:left 1s ease,bottom 1s ease;
    filter:drop-shadow(0 0 8px rgba(229,120,46,.8));
  }
  .flame::before{content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 85%,var(--gold-bright) 0%,var(--ember) 45%,transparent 75%);
    border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
    animation:flicker .5s ease-in-out infinite alternate}
  .flame::after{content:"";position:absolute;left:4px;top:8px;width:8px;height:11px;
    background:radial-gradient(ellipse at 50% 90%,#fff4d6 0%,var(--gold-bright) 60%,transparent 80%);
    border-radius:50% 50% 50% 50%/62% 62% 38% 38%}
  @keyframes flicker{from{transform:scaleY(1) rotate(-2deg)}to{transform:scaleY(1.12) rotate(2deg)}}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.85}}

  /* ---------- content column ---------- */
  .stage{width:100%;max-width:560px;padding:22px 20px 48px;flex:1}
  .eyebrow{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:11px;letter-spacing:.22em;color:var(--gold);
    text-transform:uppercase;margin-bottom:12px}
  h1{font-size:clamp(26px,7vw,34px);line-height:1.15;font-weight:700;
    text-wrap:balance;margin-bottom:14px}
  h1 .gold{color:var(--gold-bright)}
  .tale{font-size:17px;line-height:1.55;color:var(--mist);max-width:46ch;margin-bottom:22px}
  .tale strong{color:var(--parchment);font-weight:600}
  .tale em{color:var(--gold-bright);font-style:italic}

  /* choices */
  .choices{display:flex;flex-direction:column;gap:10px}
  .choices.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button.choice{
    font-family:inherit;text-align:left;cursor:pointer;
    background:var(--night-2);color:var(--parchment);
    border:1px solid var(--line);border-radius:10px;
    padding:13px 15px;font-size:16px;line-height:1.35;
    transition:border-color .15s,transform .12s,background .15s}
  button.choice:hover{border-color:var(--gold);background:#182642}
  button.choice:active{transform:scale(.98)}
  button.choice:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}
  .choice .t{display:block;font-weight:700}
  .choice .d{display:block;font-size:13.5px;color:var(--mist);margin-top:3px}

  .btn{
    display:inline-block;font-family:inherit;cursor:pointer;text-decoration:none;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    color:#241a06;font-weight:700;font-size:17px;
    border:none;border-radius:10px;padding:14px 26px;
    box-shadow:0 4px 18px rgba(212,160,56,.25);
    transition:transform .12s,box-shadow .15s}
  .btn:hover{box-shadow:0 6px 24px rgba(212,160,56,.4)}
  .btn:active{transform:scale(.97)}
  .btn:focus-visible{outline:2px solid var(--parchment);outline-offset:2px}
  .quiet{display:inline-block;margin-top:26px;font-size:14px;color:var(--mist);
    text-decoration:underline;text-underline-offset:3px;cursor:pointer;background:none;
    border:none;font-family:inherit}
  .quiet:hover{color:var(--gold-bright)}

  /* loot + reaction */
  .reaction{
    border-left:3px solid var(--gold);background:var(--night-2);
    border-radius:0 10px 10px 0;padding:14px 16px;font-size:16.5px;line-height:1.5;
    margin-bottom:18px}
  .reaction .verdict{display:block;margin-top:10px;color:var(--gold-bright);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:12px;letter-spacing:.2em;font-weight:700}
  .loot{
    display:flex;align-items:center;gap:14px;margin:0 0 22px;
    background:linear-gradient(135deg,#1d2846,#16203a);
    border:1px solid var(--gold);border-radius:12px;padding:14px 16px;
    animation:lootIn .5s ease}
  .loot .icon{font-size:30px;filter:drop-shadow(0 0 10px rgba(238,192,106,.5))}
  .loot .name{font-weight:700;color:var(--gold-bright)}
  .loot .why{font-size:13.5px;color:var(--mist)}
  .loot .label{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:10px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
  @keyframes lootIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}

  /* ceremony */
  .relics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
  .relic{background:var(--night-2);border:1px solid var(--line);border-radius:12px;
    padding:14px 8px;text-align:center}
  .relic .icon{font-size:26px;display:block;margin-bottom:6px}
  .relic .name{font-size:12.5px;color:var(--gold-bright);font-weight:700;line-height:1.25}
  .guildline{margin:4px 0 2px;color:var(--mist);font-size:15px}
  .guildline b{color:var(--parchment)}
  .unicaption{font-size:13px;color:var(--mist);font-style:italic;margin:10px 0 20px}

  /* banner preview */
  .banner{
    background:linear-gradient(135deg,#3a2c0d,#57431a);
    border:1px solid var(--gold-bright);border-radius:12px;
    padding:16px 18px;font-size:15.5px;line-height:1.5;color:#f7ecd2;
    box-shadow:0 4px 24px rgba(212,160,56,.25);margin-bottom:20px}
  .note{font-size:13px;color:var(--mist);font-style:italic;margin-top:18px;line-height:1.5}

  /* scroll form */
  .scroll-form{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .scroll-form input,.scroll-form textarea{
    font-family:inherit;font-size:16px;color:var(--parchment);
    background:var(--night-2);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;width:100%}
  .scroll-form textarea{min-height:70px;resize:vertical}
  .scroll-form input::placeholder,.scroll-form textarea::placeholder{color:#5f6c8d}
  .scroll-form input:focus-visible,.scroll-form textarea:focus-visible{
    outline:2px solid var(--gold);outline-offset:1px}

  .fade{animation:fadeUp .45s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
  @media (max-width:420px){
    .choices.grid{grid-template-columns:1fr}
  }
</style>

<div class="scene" aria-hidden="true">
  <div class="moon"></div>
  <div class="star" style="top:22px;left:12%"></div>
  <div class="star" style="top:48px;left:31%;animation-delay:.8s"></div>
  <div class="star" style="top:16px;left:55%;animation-delay:1.6s"></div>
  <div class="star" style="top:58px;left:72%;animation-delay:.4s"></div>
  <div class="star" style="top:34px;left:88%;animation-delay:2.2s"></div>
  <div class="star" style="top:74px;left:47%;animation-delay:1.1s"></div>
  <div class="peak far"></div>
  <div class="peak near"></div>
  <div class="unicorn" id="unicorn">🦄</div>
  <div class="flame" id="flame"></div>
</div>

<main class="stage" id="stage" aria-live="polite"></main>

<script>
(function(){
  "use strict";

  var SITE = "https://kindlingadvisory.com";
  var stage = document.getElementById("stage");
  var flame = document.getElementById("flame");
  var unicorn = document.getElementById("unicorn");

  /* flame waypoints up the mountain: [left%, bottom px] for steps 0..8 */
  var PATH = [[8,14],[16,26],[24,40],[33,58],[41,72],[49,92],[55,110],[60,126],[64,142]];
  function climb(step){
    var p = PATH[Math.min(step, PATH.length-1)];
    flame.style.left = p[0] + "%";
    flame.style.bottom = p[1] + "px";
  }

  var hero = { guild:null, guildName:"", treasure:null, quest:null, realm:null };

  function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
  function show(html){
    stage.innerHTML = '<div class="fade">' + html + '</div>';
    window.scrollTo({top:0, behavior:"smooth"});
  }
  function on(id, fn){ document.getElementById(id).addEventListener("click", fn); }

  /* ============ INTRO ============ */
  function intro(){
    climb(0); unicorn.classList.remove("show");
    hero = { guild:null, guildName:"", treasure:null, quest:null, realm:null };
    show(
      '<p class="eyebrow">The Gate of Kindling</p>' +
      '<h1>Beyond this mountain lies the land of <span class="gold">Kindling</span>.</h1>' +
      '<p class="tale">Only the right adventurers may pass. Forge thy company, face the three trials, and climb to the summit.</p>' +
      '<button class="btn" id="begin">⚔️ Begin the climb</button><br>' +
      '<a class="quiet" href="' + SITE + '">A returning traveller? Pass quietly through the gates →</a>'
    );
    on("begin", q1);
  }

  /* ============ THE FORGE (4 questions) ============ */
  function forgeScreen(step, title, sub, opts, grid, pick){
    climb(step);
    var html =
      '<p class="eyebrow">Forge thy company — ' + step + ' of 4</p>' +
      '<h1>' + title + '</h1>' +
      '<p class="tale">' + sub + '</p>' +
      '<div class="choices' + (grid ? ' grid' : '') + '">';
    opts.forEach(function(o,i){
      html += '<button class="choice" data-i="' + i + '"><span class="t">' + o.t + '</span>' +
              (o.d ? '<span class="d">' + o.d + '</span>' : '') + '</button>';
    });
    html += '</div>';
    show(html);
    Array.prototype.forEach.call(stage.querySelectorAll(".choice"), function(btn){
      btn.addEventListener("click", function(){ pick(opts[+btn.dataset.i]); });
    });
  }

  function q1(){
    forgeScreen(1, "Choose thy guild.",
      "Every company flies a banner. Which is thine?",
      [
        {t:"⚗️ SaaS Sorcerers", d:"Subscription spells, cast monthly", v:"pass", n:"the SaaS Sorcerers"},
        {t:"⚒️ Software Smiths", d:"Code forged into product", v:"pass", n:"the Software Smiths"},
        {t:"🪙 Fintech Forgemasters", d:"Masters of the money magic", v:"pass", n:"the Fintech Forgemasters"},
        {t:"🛡️ Consultancy Knights", d:"Wisdom for hire, armour included", v:"pass", n:"the Consultancy Knights"},
        {t:"⚖️ B2B Merchants", d:"Selling to kingdoms, not peasants", v:"pass", n:"the B2B Merchants"},
        {t:"🔬 Deeptech Alchemists", d:"Years in the lab, world-changing brews", v:"pass", n:"the Deeptech Alchemists"},
        {t:"🍺 Tavern Keepers", d:"Feeding and delighting the common folk", v:"sector", n:"the Tavern Keepers"},
        {t:"🏪 Merchants of the Bazaar", d:"Wares for the wandering crowd", v:"sector", n:"the Merchants of the Bazaar"}
      ],
      true,
      function(o){ hero.guild = o.v; hero.guildName = o.n; q2(); });
  }

  function q2(){
    forgeScreen(2, "What treasure dost thou carry?",
      "Be honest, adventurer. The mountain knows.",
      [
        {t:"📜 A dream on parchment", d:"An idea, pure and unbuilt", v:"early"},
        {t:"🗡 A forged blade, yet unsold", d:"The product is built. The world awaits.", v:"pass"},
        {t:"🪙 First gold from early conquests", d:"Real customers. Real coin.", v:"pass"},
        {t:"🤝 Kin and allies fund the quest", d:"A friends & family round, bravely raised", v:"pass"},
        {t:"⚗️ A war chest, but no army", d:"Gold raised to forge the weapon — none yet to sell it", v:"pass"},
        {t:"🏰 Series A conquered, and beyond", d:"The kingdom grows vast", v:"late"}
      ],
      false,
      function(o){ hero.treasure = o.v; q3(); });
  }

  function q3(){
    forgeScreen(3, "What quest calls thee?",
      "Why dost thou seek the land of Kindling?",
      [
        {t:"💰 Raise gold from the dragons", d:"Funding for the war ahead", v:"pass"},
        {t:"🛡️ Assemble a legion of sales legends", d:"Build the machine that conquers", v:"pass"},
        {t:"🔥 Both — gold AND legions", d:"The full campaign", v:"pass"},
        {t:"🌫️ Merely wandering these lands", d:"Curiosity, no quest as yet", v:"wander"}
      ],
      false,
      function(o){ hero.quest = o.v; q4(); });
  }

  function q4(){
    forgeScreen(4, "From which realm dost thou hail?",
      "The flame's warmth travels far — but not everywhere.",
      [
        {t:"🇬🇧 The United Kingdom", v:"pass"},
        {t:"🏰 The realms of Europe", v:"pass"},
        {t:"🌎 The Americas", v:"pass"},
        {t:"🌏 Distant lands beyond", v:"realm"}
      ],
      false,
      function(o){ hero.realm = o.v; verdict(); });
  }

  /* ============ THE VERDICT ============ */
  function verdict(){
    if (hero.guild === "sector")   return failScreen("sector");
    if (hero.treasure === "early") return failScreen("early");
    if (hero.treasure === "late")  return failScreen("late");
    if (hero.realm === "realm")    return failScreen("realm");
    if (hero.quest === "wander")   return failScreen("wander");
    trial(0);
  }

  /* ============ THE THREE TRIALS ============ */
  var TRIALS = [
    {
      name:"The Tavern of the Unconvinced",
      setup:'A weathered innkeeper eyes thy wares. <strong>"Another founder,"</strong> she mutters. <strong>"The last one promised me a \'revolutionary platform\'. It set fire to my cellar."</strong> How dost thou win her gold?',
      choices:[
        {t:"🗡 Let her hold the blade", d:"Offer a free trial",
         r:'She turns it over. Swings it once. A slow nod. <strong>"One month. Free. And if my cellar burns, I keep thy horse."</strong>', v:"SOLD"},
        {t:"🍻 Buy the whole tavern a round", d:"…and pitch the room",
         r:'The room cheers thy name. The innkeeper sighs. <strong>"Fine. FINE. Everyone\'s asking for it now. Take my gold and stop singing."</strong>', v:"SOLD"},
        {t:"📜 Unroll the scroll of testimonials", d:'"The blacksmith in the next village swears by it"',
         r:'<strong>"Borin said THAT? Borin hates everything."</strong> She squints at the scroll… and reaches for her coin purse.', v:"SOLD"}
      ],
      loot:{icon:"🪙", name:"The First Coin", why:"Proof the world will pay."}
    },
    {
      name:"The Dragon's Hoard",
      setup:'In a cavern of gold coils <strong>Vesticus the Diligent</strong>, a dragon of considerable due diligence. Smoke rises. <strong>"Thou hast TEN WORDS,"</strong> he rumbles, <strong>"before I lose interest. I am very busy and very important."</strong>',
      choices:[
        {t:'🔥 "Swords-as-a-Service. Recurring revenue."', d:'"The village NEEDS this."',
         r:'<strong>"Recurring…"</strong> the dragon whispers, his pupils widening into coin-shapes. <strong>"Say it again. Slower."</strong>', v:"FUNDED"},
        {t:'📈 "Up and to the right."', d:'"Behold this cave drawing."',
         r:'He studies the chart. <strong>"This hockey stick… I have seen ten thousand. And yet…"</strong> A single tear of molten gold rolls down his snout.', v:"FUNDED"},
        {t:'🤝 "Thy rival dragon already offered me gold."', d:"The oldest move in the cavern",
         r:'<strong>"The oldest spell in the book,"</strong> he growls. <strong>"And yet it works on me EVERY time. TAKE THE GOLD."</strong>', v:"FUNDED"}
      ],
      loot:{icon:"💎", name:"The Dragon's Favor", why:"Capital, on surprisingly reasonable terms."}
    },
    {
      name:"Assemble the Fellowship",
      setup:'At the final camp, three legends sit by the fire. <strong>Only one may join thy climb to the summit.</strong>',
      choices:[
        {t:"🎻 Bardrick the Smooth", d:"Once talked a troll into a three-year contract. Auto-renewing.",
         r:'Bardrick rises, lute in hand. <strong>"I shall open every door,"</strong> he winks, <strong>"and several that were technically walls."</strong>', v:"RECRUITED"},
        {t:"🏹 Sylra Coldarrow", d:"Has loosed 10,000 arrows into the dark. Three returned. She calls it pipeline.",
         r:'Sylra nocks an arrow. <strong>"Volume,"</strong> she says quietly, <strong>"beats luck."</strong> She has already loosed twelve more.', v:"RECRUITED"},
        {t:"⚒️ Grumli Follow-Up, son of Circle-Back", d:"Has never once let a lead go cold. NEVER.",
         r:'Grumli grips thy shoulder. <strong>"I will check in,"</strong> he vows. <strong>"Just gently bumping this to the top of thine inbox."</strong>', v:"RECRUITED"}
      ],
      loot:{icon:"🚩", name:"The Fellowship Banner", why:"No founder summits alone."}
    }
  ];

  function trial(i){
    climb(5 + i);
    var t = TRIALS[i];
    var html =
      '<p class="eyebrow">Trial ' + (i+1) + ' of 3 — ' + t.name + '</p>' +
      '<h1>' + t.name + '</h1>' +
      '<p class="tale">' + t.setup + '</p>' +
      '<div class="choices">';
    t.choices.forEach(function(c,j){
      html += '<button class="choice" data-j="' + j + '"><span class="t">' + c.t + '</span>' +
              (c.d ? '<span class="d">' + c.d + '</span>' : '') + '</button>';
    });
    html += '</div>';
    show(html);
    Array.prototype.forEach.call(stage.querySelectorAll(".choice"), function(btn){
      btn.addEventListener("click", function(){ trialResult(i, +btn.dataset.j); });
    });
  }

  function trialResult(i, j){
    var t = TRIALS[i], c = t.choices[j];
    var last = (i === TRIALS.length - 1);
    show(
      '<p class="eyebrow">Trial ' + (i+1) + ' of 3 — ' + t.name + '</p>' +
      '<div class="reaction">' + c.r + '<span class="verdict">⚔ ' + c.v + '</span></div>' +
      '<div class="loot"><span class="icon">' + t.loot.icon + '</span><span>' +
        '<span class="label">Relic looted</span><br>' +
        '<span class="name">' + t.loot.name + '</span><br>' +
        '<span class="why">' + t.loot.why + '</span></span></div>' +
      '<button class="btn" id="next">' + (last ? "🏔 The summit awaits" : "⛰ Climb on") + '</button>'
    );
    on("next", function(){ last ? ceremony() : trial(i+1); });
  }

  /* ============ THE SUMMIT CEREMONY ============ */
  function ceremony(){
    climb(8);
    unicorn.classList.add("show");
    var html =
      '<p class="eyebrow">The Summit</p>' +
      '<h1>Congratulations, <span class="gold">adventurer</span>.</h1>' +
      '<p class="guildline">Guild: <b>' + esc(hero.guildName) + '</b></p>' +
      '<div class="relics">';
    TRIALS.forEach(function(t){
      html += '<div class="relic"><span class="icon">' + t.loot.icon + '</span>' +
              '<span class="name">' + t.loot.name + '</span></div>';
    });
    html += '</div>' +
      '<p class="unicaption">…on a far peak, a unicorn grazes. One day, adventurer. 🦄</p>' +
      '<p class="tale">Thou art <strong>exactly the right warrior</strong> to enter the world of <em>Kindling Advisory</em>.</p>' +
      '<button class="btn" id="open">🔥 Open the gates</button>';
    show(html);
    on("open", gates);
  }

  function gates(){
    show(
      '<p class="eyebrow">The gates open</p>' +
      '<div class="banner">⚔️ <strong>Victorious adventurer</strong> — thou art exactly our kind of legend in the land of Kindling. Browse the armoury, and reach out when thou art ready for the fight. 💪🗡</div>' +
      '<a class="btn" href="' + SITE + '">Enter kindlingadvisory.com →</a>' +
      '<p class="note">Prototype note: in the live version the gates open straight onto thy website, with this golden banner shown atop it.</p>' +
      '<button class="quiet" id="again">↺ Begin the climb anew</button>'
    );
    on("again", intro);
  }

  /* ============ THE KIND REJECTIONS ============ */
  var FAILS = {
    early:{
      icon:"🌱", title:"Every legend begins with a first coin.",
      body:"Thy quest is true — but the mountain asks for more than a dream on parchment. When thou art ready to raise gold, or to begin assembling thy mighty squad of sales legends, <strong>return here and conquer</strong>.",
      formLead:"Leave thy scroll, and I shall summon thee when thy time comes."
    },
    late:{
      icon:"🏰", title:"Thy legend is already written.",
      body:"Armies march at thy command and dragons return thy ravens. Thou needst no gatekeeper's help — Kindling rides with those still raising their <strong>early</strong> rounds and first legions.",
      formLead:"Believe the gatekeeper has erred? Leave thy scroll, and we shall look again."
    },
    sector:{
      icon:"🚪", title:"This mountain is not thy battlefield.",
      body:"A noble trade — but Kindling marches with <strong>B2B companies of the tech persuasion</strong>. May thy quest flourish in other lands, traveller.",
      formLead:"Believe the gatekeeper has erred? Leave thy scroll, and we shall look again."
    },
    realm:{
      icon:"🌏", title:"The flame's warmth reaches not thy realm — yet.",
      body:"Kindling rides with companies of the <strong>United Kingdom, Europe and the Americas</strong>. The gatekeeper has, on occasion, been wrong.",
      formLead:"If thy quest speaks English and thy cause is true, leave thy scroll."
    },
    wander:{
      icon:"🌫️", title:"Wander well, traveller.",
      body:"The mountain opens only for those on a quest — to raise gold, or to build a legion of sales legends. Shouldst thou find thy quest, <strong>return and conquer</strong>.",
      formLead:"Or leave thy scroll, and we shall keep the fire lit for thee."
    }
  };

  function failScreen(kind){
    var f = FAILS[kind];
    show(
      '<p class="eyebrow">The gatekeeper speaks</p>' +
      '<h1>' + f.icon + ' ' + f.title + '</h1>' +
      '<p class="tale">' + f.body + '</p>' +
      '<p class="tale" style="margin-bottom:6px"><em>' + f.formLead + '</em></p>' +
      '<form class="scroll-form" id="scroll">' +
        '<input type="text" name="name" placeholder="Thy name" required>' +
        '<input type="email" name="email" placeholder="Thy raven address (email)" required>' +
        '<input type="text" name="company" placeholder="Thy company">' +
        '<textarea name="quest" placeholder="Thy quest, in a line or two"></textarea>' +
        '<button class="btn" type="submit">📜 Seal the scroll</button>' +
      '</form>' +
      '<button class="quiet" id="again">↺ Begin the climb anew</button>'
    );
    on("again", intro);
    document.getElementById("scroll").addEventListener("submit", function(e){
      e.preventDefault();
      show(
        '<p class="eyebrow">The gatekeeper speaks</p>' +
        '<h1>🔥 The scroll is sealed.</h1>' +
        '<p class="tale">A raven flies to the keep. The gatekeeper shall send word.</p>' +
        '<p class="note">Prototype note: in the live version this scroll lands in Curtis\'s inbox with the adventurer\'s answers attached.</p>' +
        '<button class="quiet" id="again2">↺ Begin the climb anew</button>'
      );
      on("again2", intro);
    });
  }

  intro();
})();
</script>
