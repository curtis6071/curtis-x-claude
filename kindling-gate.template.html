<title>The Gate of Kindling</title>
<style>
  /* ============ THE GATE OF KINDLING — prototype v3 ============
     v3: real pixel-art scenes (AI-generated by the CEO's art
     department), camera pans up the mountain as the player climbs.
     Build note: kindling-gate.html is generated from this template
     by build.py, which inlines the artwork as data URIs. */

  :root{
    --night:#0d1526;
    --night-2:#131e35;
    --parchment:#f1e8d4;
    --mist:#93a0bf;
    --gold:#d4a038;
    --gold-bright:#eec06a;
    --ember:#e5782e;
    --line:rgba(212,160,56,.25);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--night)}
  body{
    font-family:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,serif;
    color:var(--parchment);
    min-height:100svh;
    display:flex;flex-direction:column;align-items:center;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- scene panel: the artwork ---------- */
  .scene{
    position:relative;width:100%;max-width:560px;flex:none;
    aspect-ratio:16/9;max-height:44svh;
    overflow:hidden;background:#0a111f;
  }
  .layer{
    position:absolute;inset:0;
    background-size:cover;background-position:center;
    opacity:0;
    transition:opacity .9s ease, background-position 1.6s cubic-bezier(.4,0,.3,1);
  }
  .layer.on{opacity:1}
  /* logo screen: the brand floats in the night sky, glowing */
  .logo-overlay{
    position:absolute;inset:0;z-index:2;
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .9s ease}
  .logo-overlay.show{opacity:1}
  .logo-overlay img{
    height:58%;width:auto;
    animation:logoGlow 3.2s ease-in-out infinite}
  @keyframes logoGlow{
    0%,100%{filter:drop-shadow(0 0 8px rgba(238,192,106,.22)) drop-shadow(0 0 20px rgba(229,120,46,.1))}
    50%{filter:drop-shadow(0 0 12px rgba(238,192,106,.42)) drop-shadow(0 0 30px rgba(229,120,46,.2))}}
  .ember{
    position:absolute;bottom:16%;width:4px;height:4px;border-radius:50%;
    background:var(--gold-bright);opacity:0;
    animation:emberUp 5.2s linear infinite}
  @keyframes emberUp{
    0%{transform:translate(0,0) scale(1);opacity:0}
    12%{opacity:.85}
    100%{transform:translate(14px,-120px) scale(.3);opacity:0}}

  .scene .cap{
    position:absolute;left:12px;bottom:10px;z-index:3;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--gold-bright);
    background:rgba(10,17,31,.62);padding:4px 9px;border-radius:6px}
  .scene .cap:empty{display:none}
  .scene .vignette{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    box-shadow:inset 0 -26px 30px -18px rgba(10,17,31,.85),
               inset 0 14px 22px -16px rgba(10,17,31,.7)}

  /* ---------- relic pouch HUD ---------- */
  .hud{
    width:100%;max-width:560px;flex:none;
    display:none;align-items:center;gap:10px;
    padding:8px 20px;background:#0a111f;border-bottom:1px solid rgba(212,160,56,.15)}
  .hud.show{display:flex}
  .hud .lbl{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:10px;letter-spacing:.2em;color:var(--mist);text-transform:uppercase}
  .slot{width:34px;height:34px;border-radius:50%;border:1.5px dashed rgba(212,160,56,.4);
    display:flex;align-items:center;justify-content:center;font-size:17px}
  .slot.full{border-style:solid;border-color:var(--gold-bright);
    background:radial-gradient(circle,#2a2410 0%,#1a2036 80%);
    box-shadow:0 0 10px rgba(238,192,106,.35);animation:slotPop .45s ease}
  @keyframes slotPop{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}

  /* ---------- content column ---------- */
  .stage{width:100%;max-width:560px;padding:22px 20px 48px;flex:1}
  .eyebrow{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:11px;letter-spacing:.22em;color:var(--gold);
    text-transform:uppercase;margin-bottom:12px}
  h1{font-size:clamp(24px,6vw,32px);line-height:1.15;font-weight:700;
    text-wrap:balance;margin-bottom:14px}
  h1 .gold{color:var(--gold-bright)}
  .tale{font-size:16.5px;line-height:1.55;color:var(--mist);max-width:46ch;margin-bottom:20px}
  .tale strong{color:var(--parchment);font-weight:600}
  .tale em{color:var(--gold-bright);font-style:italic}

  .choices{display:flex;flex-direction:column;gap:10px}
  .choices.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button.choice{
    font-family:inherit;text-align:left;cursor:pointer;
    background:var(--night-2);color:var(--parchment);
    border:1px solid var(--line);border-radius:10px;
    padding:13px 15px;font-size:16px;line-height:1.35;
    transition:border-color .15s,transform .12s,background .15s}
  button.choice:hover{border-color:var(--gold);background:#182642}
  button.choice:active{transform:scale(.98)}
  button.choice:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}
  .choice .t{display:block;font-weight:700}
  .choice .d{display:block;font-size:13.5px;color:var(--mist);margin-top:3px}
  .choice.wide{grid-column:1/-1}
  .choice.sel{border-color:var(--gold-bright);background:#1d2a4a;
    box-shadow:inset 0 0 0 1px var(--gold-bright)}
  .choice.sel .t::after{content:" ✓";color:var(--gold-bright)}

  .btn{
    display:inline-block;font-family:inherit;cursor:pointer;text-decoration:none;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    color:#241a06;font-weight:700;font-size:17px;
    border:none;border-radius:10px;padding:14px 26px;
    box-shadow:0 4px 18px rgba(212,160,56,.25);
    transition:transform .12s,box-shadow .15s}
  .btn:hover{box-shadow:0 6px 24px rgba(212,160,56,.4)}
  .btn:active{transform:scale(.97)}
  .btn:focus-visible{outline:2px solid var(--parchment);outline-offset:2px}
  .quiet{display:inline-block;margin-top:26px;font-size:14px;color:var(--mist);
    text-decoration:underline;text-underline-offset:3px;cursor:pointer;background:none;
    border:none;font-family:inherit}
  .quiet:hover{color:var(--gold-bright)}

  /* reaction + verdict stamp */
  .reaction{
    position:relative;border-left:3px solid var(--gold);background:var(--night-2);
    border-radius:0 10px 10px 0;padding:14px 16px;font-size:16.5px;line-height:1.5;
    margin-bottom:18px}
  .stamp{
    display:inline-block;margin-top:12px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px;letter-spacing:.24em;font-weight:800;color:var(--gold-bright);
    border:2.5px solid var(--gold-bright);border-radius:6px;padding:5px 12px 5px 14px;
    transform:rotate(-6deg);
    box-shadow:0 0 14px rgba(238,192,106,.25);
    animation:stampIn .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes stampIn{0%{transform:rotate(-20deg) scale(2.6);opacity:0}
    60%{transform:rotate(-6deg) scale(.94);opacity:1}100%{transform:rotate(-6deg) scale(1)}}

  /* loot + sparkles */
  .loot{
    position:relative;display:flex;align-items:center;gap:14px;margin:0 0 22px;
    background:linear-gradient(135deg,#1d2846,#16203a);
    border:1px solid var(--gold);border-radius:12px;padding:14px 16px;
    animation:lootIn .5s cubic-bezier(.2,1.4,.4,1)}
  .loot .icon{font-size:30px;filter:drop-shadow(0 0 10px rgba(238,192,106,.5))}
  .loot .name{font-weight:700;color:var(--gold-bright)}
  .loot .why{font-size:13.5px;color:var(--mist)}
  .loot .label{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:10px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
  @keyframes lootIn{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
  .spark{position:absolute;left:26px;top:50%;width:6px;height:6px;border-radius:50%;
    background:var(--gold-bright);pointer-events:none;opacity:0;
    animation:sparkFly .8s ease-out forwards}
  @keyframes sparkFly{
    0%{transform:translate(0,0) scale(1);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

  /* ceremony */
  .relics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
  .relic{background:var(--night-2);border:1px solid var(--line);border-radius:12px;
    padding:14px 8px;text-align:center}
  .relic .icon{font-size:26px;display:block;margin-bottom:6px}
  .relic .name{font-size:12.5px;color:var(--gold-bright);font-weight:700;line-height:1.25}
  .guildline{margin:4px 0 2px;color:var(--mist);font-size:15px}
  .guildline b{color:var(--parchment)}
  .unicaption{font-size:13px;color:var(--mist);font-style:italic;margin:10px 0 20px}

  .banner{
    background:linear-gradient(135deg,#3a2c0d,#57431a);
    border:1px solid var(--gold-bright);border-radius:12px;
    padding:16px 18px;font-size:15.5px;line-height:1.5;color:#f7ecd2;
    box-shadow:0 4px 24px rgba(212,160,56,.25);margin-bottom:20px}
  .note{font-size:13px;color:var(--mist);font-style:italic;margin-top:18px;line-height:1.5}

  .scroll-form{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .scroll-form input,.scroll-form textarea{
    font-family:inherit;font-size:16px;color:var(--parchment);
    background:var(--night-2);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;width:100%}
  .scroll-form textarea{min-height:70px;resize:vertical}
  .scroll-form input::placeholder,.scroll-form textarea::placeholder{color:#5f6c8d}
  .scroll-form input:focus-visible,.scroll-form textarea:focus-visible{
    outline:2px solid var(--gold);outline-offset:1px}

  .fade{animation:fadeUp .45s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
  @media (max-width:420px){
    .choices.grid{grid-template-columns:1fr}
  }
</style>

<div class="scene" id="scene" aria-hidden="true">
  <div class="layer" id="layerA"></div>
  <div class="layer" id="layerB"></div>
  <div class="vignette"></div>
  <div class="logo-overlay" id="logoOv">
    <span class="ember" style="left:44%;animation-delay:0s"></span>
    <span class="ember" style="left:50%;animation-delay:1.3s"></span>
    <span class="ember" style="left:56%;animation-delay:2.6s"></span>
    <span class="ember" style="left:47%;animation-delay:3.4s"></span>
    <span class="ember" style="left:53%;animation-delay:4.5s"></span>
    <img id="logoImg" alt="Kindling Advisory">
  </div>
  <span class="cap" id="cap"></span>
</div>
<div class="hud" id="hud">
  <span class="lbl">🎒 Relic pouch</span>
  <span class="slot" id="slot0"></span>
  <span class="slot" id="slot1"></span>
  <span class="slot" id="slot2"></span>
</div>
<main class="stage" id="stage" aria-live="polite"></main>

<script>
(function(){
  "use strict";

  var SITE = "https://kindlingadvisory.com";

  /* ============ ARTWORK (inlined by build.py) ============ */
  var ART = {
    mountain:"__IMG_MOUNTAIN__",
    tavern:"__IMG_TAVERN__",
    dragon:"__IMG_DRAGON__",
    camp:"__IMG_CAMP__",
    summit:"__IMG_SUMMIT__",
    gate:"__IMG_GATE__",
    gateopen:"__IMG_GATEOPEN__",
    nightsky:"__IMG_NIGHTSKY__",
    logo:"__IMG_LOGO__"
  };

  var stage = document.getElementById("stage");
  var hud = document.getElementById("hud");
  var capEl = document.getElementById("cap");
  var layers = [document.getElementById("layerA"), document.getElementById("layerB")];
  var logoOv = document.getElementById("logoOv");
  document.getElementById("logoImg").src = ART.logo;
  var front = 0, curKey = "";

  /* the camera pans up the tall mountain image as the player climbs:
     background-position-y % per progress step (100 = base, 0 = peak) */
  var CLIMB_Y = [100, 62, 30, 12];
  var CLIMB_CAPS = ["The climb begins","Above the clouds","The final ascent","Beneath the summit"];

  function setScene(key, step, cap){
    var isClimb = (key === "climb");
    var url = isClimb ? ART.mountain : ART[key];
    var posY = isClimb ? CLIMB_Y[Math.min(step||0, CLIMB_Y.length-1)] : 50;
    var caption = cap || (isClimb ? CLIMB_CAPS[Math.min(step||0, CLIMB_CAPS.length-1)] : "");
    if (key === curKey && isClimb){
      /* same artwork: glide the camera instead of swapping */
      layers[front].style.backgroundPosition = "center " + posY + "%";
      capEl.textContent = caption;
      return;
    }
    var back = 1 - front;
    layers[back].style.backgroundImage = "url('" + url + "')";
    layers[back].style.backgroundPosition = "center " + posY + "%";
    /* force style flush so the fade transitions cleanly */
    void layers[back].offsetWidth;
    layers[back].classList.add("on");
    layers[front].classList.remove("on");
    front = back; curKey = key;
    capEl.textContent = caption;
  }
  /* the glowing logo appears only over the night sky */
  var _setScene = setScene;
  setScene = function(key, step, cap){
    _setScene(key, step, cap);
    logoOv.classList.toggle("show", key === "nightsky");
  };

  /* ================= GAME STATE ================= */
  var hero = { guild:null, guildName:"", deeptech:false, treasures:{}, quest:null, realm:null };
  var relicsWon = 0;

  function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
  function show(html){
    stage.innerHTML = '<div class="fade">' + html + '</div>';
    window.scrollTo({top:0, behavior:"smooth"});
  }
  function on(id, fn){ document.getElementById(id).addEventListener("click", fn); }
  function updateHUD(){
    var icons = ["🪙","💎","🚩"];
    for (var i=0;i<3;i++){
      var slot = document.getElementById("slot"+i);
      if (i < relicsWon){ slot.textContent = icons[i]; slot.classList.add("full"); }
      else { slot.textContent = ""; slot.classList.remove("full"); }
    }
  }

  /* ================= INTRO ================= */
  function intro(){
    hero = { guild:null, guildName:"", deeptech:false, treasures:{}, quest:null, realm:null };
    relicsWon = 0; hud.classList.remove("show"); updateHUD();
    setScene("nightsky", 0, "");
    show(
      '<p class="eyebrow">Kindling Advisory</p>' +
      '<h1>Beyond this mountain lies the land of <span class="gold">Kindling</span>.</h1>' +
      '<p class="tale">A 90-second quest guards the website. Win your way in.</p>' +
      '<button class="btn" id="begin">⚔️ Begin the climb</button><br>' +
      '<a class="quiet" href="' + SITE + '">In a hurry? Skip the quest →</a>'
    );
    on("begin", q1);
  }

  /* ================= THE FORGE ================= */
  function forgeScreen(step, title, sub, opts, grid, pick){
    setScene("gate", 0, "Before the gate of Kindling");
    var html =
      '<p class="eyebrow">Forge thy company — ' + step + ' of 4</p>' +
      '<h1>' + title + '</h1>' +
      '<p class="tale">' + sub + '</p>' +
      '<div class="choices' + (grid ? ' grid' : '') + '">';
    opts.forEach(function(o,i){
      html += '<button class="choice' + (o.wide ? ' wide' : '') + '" data-i="' + i + '"><span class="t">' + o.t + '</span>' +
              (o.d ? '<span class="d">' + o.d + '</span>' : '') + '</button>';
    });
    html += '</div>';
    show(html);
    Array.prototype.forEach.call(stage.querySelectorAll(".choice"), function(btn){
      btn.addEventListener("click", function(){ pick(opts[+btn.dataset.i]); });
    });
  }

  function q1(asProxy){
    var opts = [
      {t:"⚗️ Software Sorcerers", d:"SaaS, fintech, AI — 'software' means everything these days", v:"pass", n:"the Software Sorcerers"},
      {t:"🔬 Deeptech Alchemists", d:"Years in the lab, world-changing brews", v:"pass", n:"the Deeptech Alchemists", deep:true},
      {t:"🛡️ Consultancy Knights", d:"Wisdom for hire, armour included", v:"pass", n:"the Consultancy Knights"},
      {t:"⚖️ B2B Merchants", d:"Selling to kingdoms, not peasants", v:"pass", n:"the B2B Merchants"},
      {t:"🍺 Tavern Keepers", d:"Feeding and delighting the common folk", v:"sector", n:"the Tavern Keepers"},
      {t:"🏪 Merchants of the Bazaar", d:"Wares for the wandering crowd", v:"sector", n:"the Merchants of the Bazaar"}
    ];
    if (!asProxy) opts.push(
      {t:"🧭 A Wandering Observer", d:"Investor, advisor, or curious soul — no company banner to fly", v:"observer", wide:true});
    forgeScreen(1, "Choose thy guild.",
      asProxy ? "Which banner does thy champion's company fly?"
              : "Every company flies a banner. Which is thine?",
      opts, true,
      function(o){
        if (o.v === "observer") return observer();
        hero.guild = o.v; hero.guildName = o.n; hero.deeptech = !!o.deep; q2();
      });
  }

  function q2(){
    setScene("gate", 0, "Before the gate of Kindling");
    var opts = [
      {t:"📜 A dream on parchment", d:"An idea, pure and unbuilt", v:"early"},
      {t:"🗡 A forged blade, yet unsold", d:"The product is built. The world awaits.", v:"blade"},
      {t:"🪙 First gold from early conquests", d:"Real customers. Real coin.", v:"gold"},
      {t:"🤝 Kin and allies fund the quest", d:"A friends & family round, bravely raised", v:"kin"},
      {t:"⚗️ A war chest, but no army", d:"Pre-seed or beyond, raised to forge the weapon — none yet to sell it", v:"chest"},
      {t:"🏰 Series A conquered, and beyond", d:"The kingdom grows vast", v:"late"}
    ];
    var html =
      '<p class="eyebrow">Forge thy company — 2 of 4</p>' +
      '<h1>What treasures dost thou carry?</h1>' +
      '<p class="tale">Choose all that thou carriest. Be honest, adventurer — the mountain knows.</p>' +
      '<div class="choices">';
    opts.forEach(function(o,i){
      html += '<button class="choice" data-i="' + i + '"><span class="t">' + o.t + '</span>' +
              '<span class="d">' + o.d + '</span></button>';
    });
    html += '</div><button class="btn" id="carry" disabled style="margin-top:16px;opacity:.45">🎒 Carry on</button>';
    show(html);
    hero.treasures = {};
    var carry = document.getElementById("carry");
    Array.prototype.forEach.call(stage.querySelectorAll(".choice"), function(btn){
      btn.addEventListener("click", function(){
        var v = opts[+btn.dataset.i].v;
        hero.treasures[v] = !hero.treasures[v];
        btn.classList.toggle("sel", hero.treasures[v]);
        var any = opts.some(function(o){ return hero.treasures[o.v]; });
        carry.disabled = !any;
        carry.style.opacity = any ? "1" : ".45";
      });
    });
    carry.addEventListener("click", q3);
  }

  function q3(){
    forgeScreen(3, "What quest calls thee?",
      "Why dost thou seek the land of Kindling?",
      [
        {t:"💰 Raise gold from the dragons", d:"Funding for the war ahead", v:"raise"},
        {t:"🛡️ Assemble a legion of sales legends", d:"Build the machine that conquers", v:"legion"},
        {t:"🔥 Both — gold AND legions", d:"The full campaign", v:"both"},
        {t:"🌫️ Merely wandering these lands", d:"Curiosity, no quest as yet", v:"wander"}
      ],
      false,
      function(o){ hero.quest = o.v; q4(); });
  }

  function q4(){
    forgeScreen(4, "From which realm dost thou hail?",
      "The flame's warmth travels far — but not everywhere.",
      [
        {t:"🇬🇧 The United Kingdom", v:"pass"},
        {t:"🏰 The realms of Europe", v:"pass"},
        {t:"🇺🇸 The Americas", v:"pass"},
        {t:"🌏 Distant lands beyond", v:"realm"}
      ],
      false,
      function(o){ hero.realm = o.v; verdict(); });
  }

  /* ================= THE VERDICT ================= */
  function verdict(){
    var t = hero.treasures;
    var anyPass = t.blade || t.gold || t.kin || t.chest;
    if (hero.guild === "sector") return failScreen("sector");
    /* the deeptech exception: a big war chest raised to forge the
       brew, but still no army — the one late-stage company Kindling
       will climb with */
    if (t.late && !(hero.deeptech && hero.quest !== "wander"))
      return failScreen("late");
    if (!anyPass && !t.late)     return failScreen("early");
    if (hero.realm === "realm")  return failScreen("realm");
    if (hero.quest === "wander") return failScreen("wander");
    accepted();
  }

  /* travellers without a company banner: investors, advisors,
     the curious — invited to climb on behalf of a champion */
  function observer(){
    setScene("gate", 0, "A traveller at the gate");
    show(
      '<p class="eyebrow">The gatekeeper squints</p>' +
      '<h1>Ah — an <span class="gold">observer</span> among us.</h1>' +
      '<p class="tale">Investors, advisors, curious souls — most welcome. But the mountain judges <strong>companies</strong>, not travellers.</p>' +
      '<p class="tale"><em>Climb on behalf of a champion — a company thou fundest, advisest, or believest in — and answer as they would. Their guild, their treasure, their quest.</em></p>' +
      '<button class="btn" id="proxy">⚔️ Climb for thy champion</button>' +
      '<br><a class="quiet" href="' + SITE + '">No champion in mind? Pass quietly through the gates →</a>'
    );
    on("proxy", function(){ q1(true); });
  }

  function accepted(){
    setScene("climb", 0);
    hud.classList.add("show"); updateHUD();
    show(
      '<p class="eyebrow">The forge is complete</p>' +
      '<h1>⚡ The mountain <span class="gold">accepts thee</span>.</h1>' +
      '<p class="tale">Champion of <strong>' + esc(hero.guildName) + '</strong> — thy scroll is read, thy banner recognised. But none may enter the land of Kindling untested.</p>' +
      '<p class="tale"><em>Three trials stand between thee and the summit.</em></p>' +
      '<button class="btn" id="go">⚔️ Face the first trial</button>'
    );
    on("go", function(){ trial(0); });
  }

  /* ================= THE THREE TRIALS ================= */
  var TRIALS = [
    {
      name:"The Tavern of the Unconvinced", scene:"tavern",
      setup:'A weathered innkeeper eyes thy wares. <strong>"Another founder,"</strong> she mutters. <strong>"The last one promised me a \'revolutionary platform\'. It set fire to my cellar."</strong> How dost thou win her gold?',
      choices:[
        {t:"🗡 Let her hold the blade", d:"Offer a free trial",
         r:'She turns it over. Swings it once. A slow nod. <strong>"One month. Free. And if my cellar burns, I keep thy horse."</strong>', v:"SOLD"},
        {t:"🍻 Buy the whole tavern a round", d:"…and pitch the room",
         r:'The room cheers thy name. The innkeeper sighs. <strong>"Fine. FINE. Everyone\'s asking for it now. Take my gold and stop singing."</strong>', v:"SOLD"},
        {t:"📜 Unroll the scroll of testimonials", d:'"The blacksmith in the next village swears by it"',
         r:'<strong>"Borin said THAT? Borin hates everything."</strong> She squints at the scroll… and reaches for her coin purse.', v:"SOLD"}
      ],
      loot:{icon:"🪙", name:"The First Coin", why:"Proof the world will pay."},
      afterStep:1
    },
    {
      name:"The Dragon's Hoard", scene:"dragon",
      setup:'In a cavern of gold coils <strong>Vesticus the Diligent</strong>, a dragon of considerable due diligence. Note the gilet. <strong>"Thou hast TEN WORDS,"</strong> he rumbles, <strong>"before I lose interest. I am very busy and very important."</strong>',
      choices:[
        {t:'🔥 "Swords-as-a-Service. Recurring revenue."', d:'"The village NEEDS this."',
         r:'<strong>"Recurring…"</strong> the dragon whispers, his pupils widening into coin-shapes. <strong>"Say it again. Slower."</strong>', v:"FUNDED"},
        {t:'📈 "Up and to the right."', d:'"Behold this cave drawing."',
         r:'He studies the chart. <strong>"This hockey stick… I have seen ten thousand. And yet…"</strong> A single tear of molten gold rolls down his snout.', v:"FUNDED"},
        {t:'🤝 "Thy rival dragon already offered me gold."', d:"The oldest move in the cavern",
         r:'<strong>"The oldest spell in the book,"</strong> he growls. <strong>"And yet it works on me EVERY time. TAKE THE GOLD."</strong>', v:"FUNDED"}
      ],
      loot:{icon:"💎", name:"The Dragon's Favor", why:"Capital, on surprisingly reasonable terms."},
      afterStep:2
    },
    {
      name:"Assemble the Fellowship", scene:"camp",
      setup:'At the final camp, three legends sit by the fire. <strong>Only one may join thy climb to the summit.</strong>',
      choices:[
        {t:"🎻 Bardrick the Smooth", d:"Once talked a troll into a three-year contract. Auto-renewing.",
         r:'Bardrick rises, lute in hand. <strong>"I shall open every door,"</strong> he winks, <strong>"and several that were technically walls."</strong>', v:"RECRUITED"},
        {t:"🏹 Sylra Coldarrow", d:"Has loosed 10,000 arrows into the dark. Three returned. She calls it pipeline.",
         r:'Sylra nocks an arrow. <strong>"Volume,"</strong> she says quietly, <strong>"beats luck."</strong> She has already loosed twelve more.', v:"RECRUITED"},
        {t:"⚒️ Grumli Follow-Up, son of Circle-Back", d:"Has never once let a lead go cold. NEVER.",
         r:'Grumli grips thy shoulder. <strong>"I will check in,"</strong> he vows. <strong>"Just gently bumping this to the top of thine inbox."</strong>', v:"RECRUITED"}
      ],
      loot:{icon:"🚩", name:"The Fellowship Banner", why:"No founder summits alone."},
      afterStep:3
    }
  ];

  function trial(i){
    var t = TRIALS[i];
    setScene(t.scene, 0, "Trial " + ["I","II","III"][i] + " — " + t.name);
    var html =
      '<p class="eyebrow">Trial ' + (i+1) + ' of 3</p>' +
      '<h1>' + t.name + '</h1>' +
      '<p class="tale">' + t.setup + '</p>' +
      '<div class="choices">';
    t.choices.forEach(function(c,j){
      html += '<button class="choice" data-j="' + j + '"><span class="t">' + c.t + '</span>' +
              (c.d ? '<span class="d">' + c.d + '</span>' : '') + '</button>';
    });
    html += '</div>';
    show(html);
    Array.prototype.forEach.call(stage.querySelectorAll(".choice"), function(btn){
      btn.addEventListener("click", function(){ trialResult(i, +btn.dataset.j); });
    });
  }

  function sparks(host){
    for (var k=0;k<7;k++){
      var s = document.createElement("span");
      s.className = "spark";
      var ang = (Math.PI*2/7)*k, dist = 34 + Math.random()*26;
      s.style.setProperty("--dx", Math.cos(ang)*dist + "px");
      s.style.setProperty("--dy", Math.sin(ang)*dist - 10 + "px");
      s.style.animationDelay = (Math.random()*.15) + "s";
      host.appendChild(s);
    }
  }

  function trialResult(i, j){
    var t = TRIALS[i], c = t.choices[j];
    var last = (i === TRIALS.length - 1);
    /* the world moves on: back to the mountain, higher than before */
    setScene("climb", t.afterStep);
    show(
      '<p class="eyebrow">Trial ' + (i+1) + ' of 3 — ' + t.name + '</p>' +
      '<div class="reaction">' + c.r + '<br><span class="stamp">⚔ ' + c.v + '</span></div>' +
      '<div class="loot" id="lootbox"><span class="icon">' + t.loot.icon + '</span><span>' +
        '<span class="label">Relic looted</span><br>' +
        '<span class="name">' + t.loot.name + '</span><br>' +
        '<span class="why">' + t.loot.why + '</span></span></div>' +
      '<button class="btn" id="next">' + (last ? "🏔 The summit awaits" : "⛰ Climb on") + '</button>'
    );
    relicsWon = i + 1; updateHUD();
    sparks(document.getElementById("lootbox"));
    on("next", function(){ last ? ceremony() : trial(i+1); });
  }

  /* ================= THE SUMMIT ================= */
  function ceremony(){
    setScene("summit", 0, "The summit 🏔");
    var html =
      '<p class="eyebrow">The Summit</p>' +
      '<h1>Congratulations, <span class="gold">adventurer</span>.</h1>' +
      '<p class="guildline">Guild: <b>' + esc(hero.guildName) + '</b></p>' +
      '<div class="relics">';
    TRIALS.forEach(function(t){
      html += '<div class="relic"><span class="icon">' + t.loot.icon + '</span>' +
              '<span class="name">' + t.loot.name + '</span></div>';
    });
    html += '</div>' +
      '<p class="unicaption">…on a far peak, a unicorn grazes. One day, adventurer. 🦄</p>' +
      '<p class="tale">Thou art <strong>exactly the right warrior</strong> to enter the world of <em>Kindling Advisory</em>.</p>' +
      '<button class="btn" id="open">🔥 Open the gates</button>';
    show(html);
    on("open", gates);
  }

  function gates(){
    setScene("gateopen", 0, "The land of Kindling");
    hud.classList.remove("show");
    show(
      '<p class="eyebrow">The gates open</p>' +
      '<div class="banner">⚔️ <strong>Victorious adventurer</strong> — thou art exactly our kind of legend in the land of Kindling. Browse the armoury, and reach out when thou art ready for the fight. 💪🗡</div>' +
      '<a class="btn" href="' + SITE + '">Enter the website — kindlingadvisory.com →</a>' +
      '<p class="note">Prototype note: in the live version the gates open straight onto thy website, with this golden banner shown atop it.</p>' +
      '<button class="quiet" id="again">↺ Begin the climb anew</button>'
    );
    on("again", intro);
  }

  /* ================= THE KIND REJECTIONS ================= */
  var FAILS = {
    early:{
      icon:"🌱", title:"Every legend begins with a first coin.",
      body:"Thy quest is true — but the mountain asks for more than a dream on parchment. Thy first quest stands clear: <strong>forge thy blade, win thy first gold, or rally kin and allies to thy cause</strong> — then return here and conquer.",
      formLead:"Leave thy scroll, and I shall summon thee when thy time comes."
    },
    late:{
      icon:"🏰", title:"Thy legend is already written.",
      body:"Armies march at thy command and dragons return thy ravens. Thou needst no gatekeeper's help — Kindling rides with those still raising their <strong>early</strong> rounds and first legions.",
      formLead:"Believe the gatekeeper has erred? Leave thy scroll, and we shall look again."
    },
    sector:{
      icon:"🚪", title:"This mountain is not thy battlefield.",
      body:"A noble trade — but Kindling marches with <strong>B2B companies of the tech persuasion</strong>. May thy quest flourish in other lands, traveller.",
      formLead:"Believe the gatekeeper has erred? Leave thy scroll, and we shall look again."
    },
    realm:{
      icon:"🌏", title:"The flame's warmth reaches not thy realm — yet.",
      body:"Kindling rides with companies of the <strong>United Kingdom, Europe and the Americas</strong>. The gatekeeper has, on occasion, been wrong.",
      formLead:"If thy quest speaks English and thy cause is true, leave thy scroll."
    },
    wander:{
      icon:"🌫️", title:"Wander well, traveller.",
      body:"The mountain opens only for those on a quest — to raise gold, or to build a legion of sales legends. Shouldst thou find thy quest, <strong>return and conquer</strong>.",
      formLead:"Or leave thy scroll, and we shall keep the fire lit for thee."
    }
  };

  function failScreen(kind){
    var f = FAILS[kind];
    setScene("gate", 0, "The gate stays shut");
    show(
      '<p class="eyebrow">The gatekeeper speaks</p>' +
      '<h1>' + f.icon + ' ' + f.title + '</h1>' +
      '<p class="tale">' + f.body + '</p>' +
      '<p class="tale" style="margin-bottom:6px"><em>' + f.formLead + '</em></p>' +
      '<form class="scroll-form" id="scroll">' +
        '<input type="text" name="name" placeholder="Thy name" required>' +
        '<input type="email" name="email" placeholder="Thy raven address (email)" required>' +
        '<input type="text" name="company" placeholder="Thy company">' +
        '<textarea name="quest" placeholder="Thy quest, in a line or two"></textarea>' +
        '<button class="btn" type="submit">📜 Seal the scroll</button>' +
      '</form>' +
      '<button class="quiet" id="again">↺ Begin the climb anew</button>'
    );
    on("again", intro);
    document.getElementById("scroll").addEventListener("submit", function(e){
      e.preventDefault();
      show(
        '<p class="eyebrow">The gatekeeper speaks</p>' +
        '<h1>🔥 The scroll is sealed.</h1>' +
        '<p class="tale">A raven flies to the keep. The gatekeeper shall send word.</p>' +
        '<p class="note">Prototype note: in the live version this scroll lands in Curtis\'s inbox with the adventurer\'s answers attached.</p>' +
        '<button class="quiet" id="again2">↺ Begin the climb anew</button>'
      );
      on("again2", intro);
    });
  }

  intro();
})();
</script>
